# SkillGap AI Kubernetes Deployment
# Deploy to AWS EKS or similar Kubernetes cluster

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: skillgap-ai

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: skillgap-config
  namespace: skillgap-ai
data:
  APP_ENV: "production"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

---
# Secret for sensitive configuration
apiVersion: v1
kind: Secret
metadata:
  name: skillgap-secrets
  namespace: skillgap-ai
type: Opaque
stringData:
  OPENAI_API_KEY: "${OPENAI_API_KEY}"
  GITHUB_PAT: "${GITHUB_PAT}"
  SECRET_KEY: "${SECRET_KEY}"
  SUPABASE_URL: "${SUPABASE_URL}"
  SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY}"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"

---
# Service for Redis
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: skillgap-ai
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  clusterIP: None

---
# StatefulSet for Redis
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: skillgap-ai
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command:
            - redis-server
            - "--appendonly"
            - "yes"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

---
# Service for FastAPI API
apiVersion: v1
kind: Service
metadata:
  name: skillgap-api
  namespace: skillgap-ai
  labels:
    app: skillgap-api
spec:
  type: LoadBalancer
  selector:
    app: skillgap-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000

---
# Deployment for FastAPI API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillgap-api
  namespace: skillgap-ai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: skillgap-api
  template:
    metadata:
      labels:
        app: skillgap-api
    spec:
      containers:
        - name: api
          image: skillgap-ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          command:
            - uvicorn
            - fastapi_app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --workers
            - "4"
          envFrom:
            - configMapRef:
                name: skillgap-config
            - secretRef:
                name: skillgap-secrets
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/1
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir: {}

---
# HorizontalPodAutoscaler for API
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skillgap-api-hpa
  namespace: skillgap-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skillgap-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# Deployment for Celery Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillgap-worker
  namespace: skillgap-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skillgap-worker
  template:
    metadata:
      labels:
        app: skillgap-worker
    spec:
      containers:
        - name: worker
          image: skillgap-ai:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - fastapi_app.worker
            - worker
            - --loglevel=info
            - --concurrency=4
          envFrom:
            - configMapRef:
                name: skillgap-config
            - secretRef:
                name: skillgap-secrets
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/1
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"

---
# HorizontalPodAutoscaler for Worker
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skillgap-worker-hpa
  namespace: skillgap-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skillgap-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
